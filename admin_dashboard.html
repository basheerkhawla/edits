<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>Tele-Starz | لوحة تحكم الإدارة</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --surface2: #334155;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --success: #10b981;
      --warn: #f59e0b;
      --error: #ef4444;
      --radius: 8px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'IBM Plex Sans Arabic', sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; }
    
    .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
    h1 { font-size: 1.5rem; display: flex; align-items: center; gap: 8px; }
    
    .login-box { max-width: 400px; margin: 100px auto; background: var(--surface); padding: 24px; border-radius: var(--radius); border: 1px solid var(--border); text-align: center; }
    .input-field { width: 100%; padding: 12px; margin-bottom: 16px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--surface2); color: var(--text); font-size: 1rem; outline: none; }
    .input-field:focus { border-color: var(--accent); }
    .btn { background: var(--accent); color: #fff; border: none; padding: 10px 16px; border-radius: var(--radius); cursor: pointer; font-size: 1rem; font-weight: 600; transition: background 0.2s; }
    .btn:hover { background: var(--accent-hover); }
    .btn-sm { font-size: 0.8rem; padding: 6px 10px; }
    
    .tabs { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
    .tab-btn { background: var(--surface2); color: var(--text); border: 1px solid var(--border); padding: 10px 16px; border-radius: var(--radius); cursor: pointer; font-weight: 600; transition: all 0.2s; }
    .tab-btn.active { background: var(--accent); border-color: var(--accent); }
    
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 20px; overflow-x: auto; }
    
    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; text-align: right; }
    th, td { padding: 12px; border-bottom: 1px solid var(--border); white-space: nowrap; }
    th { color: var(--text-muted); font-weight: 600; background: rgba(0,0,0,0.2); }
    tr:last-child td { border-bottom: none; }
    tr:hover { background: rgba(255,255,255,0.02); }
    
    .badge { padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: 600; display: inline-block; }
    .b-completed, .b-paid { background: rgba(16,185,129,0.2); color: var(--success); }
    .b-pending, .b-awaiting_payment { background: rgba(245,158,11,0.2); color: var(--warn); }
    .b-failed, .b-expired { background: rgba(239,68,68,0.2); color: var(--error); }
    
    .filters { display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
    .search-input { padding: 8px 12px; border-radius: 4px; border: 1px solid var(--border); background: var(--bg); color: var(--text); flex-grow: 1; max-width: 300px; }
    
    .error-text { color: var(--error); font-size: 0.8rem; max-width: 250px; white-space: normal; line-height: 1.4; display: block; margin-top: 4px; font-family: monospace; }
    .flags { display: flex; gap: 4px; flex-direction: column; margin-top: 4px; }
    .flag { font-size: 0.7rem; padding: 2px 6px; border-radius: 4px; background: rgba(245,158,11,0.2); color: var(--warn); border: 1px solid var(--warn); display: inline-block; }
    
    .loading { text-align: center; padding: 40px; color: var(--text-muted); }
  </style>
  <script src="https://www.google.com/recaptcha/api.js" async defer></script>
</head>
<body>

<div id="loginSection" class="login-box">
  <h2>🔒 الدخول للإدارة</h2>
  <p style="color:var(--text-muted); font-size:0.9rem; margin-bottom:20px;">قم بتسجيل الدخول للمتابعة</p>
  <input type="email" id="adminEmail" class="input-field" placeholder="البريد الإلكتروني">
  <input type="password" id="adminPassword" class="input-field" placeholder="كلمة المرور">
  <div style="display:flex; justify-content:center; margin-bottom:16px;">
      <div class="g-recaptcha" data-sitekey="6Lfx020tAAAAABejyPqIkTcbZlrH7KA3X6BtzB1p" data-theme="dark"></div>
  </div>
  <button class="btn" id="loginBtn" style="width:100%" onclick="login()">دخول</button>
  <div id="loginError" style="color:var(--error); margin-top:10px; font-size:0.85rem;"></div>
</div>

<div id="appSection" class="container" style="display:none;">
  <header>
    <h1>⭐ Tele-Starz Admin</h1>
    <div>
      <span id="lastUpdate" style="font-size:0.8rem; color:var(--text-muted); margin-left:12px;"></span>
      <button class="btn btn-sm" onclick="logout()" style="background:var(--surface2);">خروج</button>
    </div>
  </header>
  
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('orders')">📦 الطلبات</button>
    <button class="tab-btn" onclick="switchTab('withdrawals')">💸 سحوبات الإحالات</button>
    <button class="tab-btn" onclick="switchTab('settings')">⚙️ الإعدادات (السعر)</button>
  </div>
  
  <div id="tab-orders" class="card">
    <div class="filters">
      <input type="text" id="orderSearch" class="search-input" placeholder="بحث باليوزر، ID الطلب، أو الكومنت..." onkeyup="if(event.key==='Enter') loadOrders()">
      <select id="orderStatus" class="input-field" style="width:auto; margin-bottom:0;" onchange="loadOrders()">
        <option value="">جميع الحالات</option>
        <option value="completed">مكتمل</option>
        <option value="failed">فاشل</option>
        <option value="pending">معلق</option>
        <option value="paid">تم الدفع</option>
      </select>
      <button class="btn btn-sm" onclick="loadOrders()">بحث 🔍</button>
    </div>
    <div id="ordersContent" style="overflow-x:auto;"></div>
  </div>
  
  
  <div id="tab-settings" class="card" style="display:none; max-width: 500px;">
    <h3>تحديث سعر النجمة (بحد أقصى 10%)</h3>
    <p style="color:var(--text-muted); font-size:0.85rem; margin-bottom:15px;">السعر الأساسي المرجعي: 0.018$ (المسموح: 0.0162$ - 0.0198$)</p>
    
    <div style="display:flex; gap:10px; margin-bottom:10px;">
      <input type="number" id="newPrice" step="0.0001" class="input-field" placeholder="مثال: 0.018" style="margin-bottom:0;">
      <button class="btn" onclick="updatePrice()">حفظ السعر</button>
    </div>
    <div id="priceMsg" style="font-size:0.85rem; margin-top:5px;"></div>
    
    <hr style="border-color: #333; margin: 20px 0;">
    
    <h3>نسبة عمولة الإحالة (10% إلى 40%)</h3>
    <div style="display:flex; gap:10px; margin-bottom:10px;">
      <input type="number" id="newCommission" min="10" max="40" step="1" class="input-field" placeholder="مثال: 10" style="margin-bottom:0;">
      <button class="btn" onclick="updateCommission()">حفظ النسبة</button>
    </div>
    <div id="commMsg" style="font-size:0.85rem; margin-top:5px;"></div>
  </div>

  <div id="tab-withdrawals" class="card" style="display:none;">
    <button class="btn btn-sm" onclick="loadWithdrawals()" style="margin-bottom:16px;">تحديث 🔄</button>
    <div id="withdrawalsContent" style="overflow-x:auto;"></div>
  </div>
</div>

<script>
  let TOKEN = localStorage.getItem('adminToken') || '';
  let currentTab = 'orders';
  let refreshTimer = null;
  async function login() {
    let email = document.getElementById('adminEmail').value.trim();
    let pass = document.getElementById('adminPassword').value.trim();
    let captcha = '';
    if(window.grecaptcha) captcha = grecaptcha.getResponse();
    let err = document.getElementById('loginError');
    let btn = document.getElementById('loginBtn');
    err.innerText = '';
    
    if (!captcha) {
        err.innerText = 'الرجاء حل الكابتشا';
        return;
    }
    if (!email || !pass) {
        err.innerText = 'يرجى إدخال الإيميل والباسورد';
        return;
    }
    
    btn.disabled = true;
    btn.innerText = 'جاري التحقق...';
    try {
        let res = await fetch('/admin/login', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({email: email, password: pass, captcha: captcha})
        });
        if (!res.ok) throw new Error('البيانات غير صحيحة');
        let data = await res.json();
        TOKEN = data.token;
        localStorage.setItem('adminToken', TOKEN);
        document.getElementById('loginSection').style.display = 'none';
        document.getElementById('appSection').style.display = 'block';
        startApp();
    } catch(e) {
        err.innerText = e.message;
        if(window.grecaptcha) grecaptcha.reset();
    } finally {
        btn.disabled = false;
        btn.innerText = 'دخول';
    }
  }

  function logout() {
    localStorage.removeItem('adminToken');
    TOKEN = '';
    clearInterval(refreshTimer);
    document.getElementById('appSection').style.display = 'none';
    document.getElementById('loginSection').style.display = 'block';
    if(window.grecaptcha) grecaptcha.reset();
  }

  function startApp() {
    loadOrders();
    refreshTimer = setInterval(() => {
      if(currentTab === 'orders') loadOrders(false);
      else loadWithdrawals(false);
    }, 30000);
  }

  function switchTab(tab) {
    currentTab = tab;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    event.target.classList.add('active');
    
    document.getElementById('tab-orders').style.display = 'none';
    document.getElementById('tab-withdrawals').style.display = 'none';
    document.getElementById('tab-settings').style.display = 'none';
    document.getElementById('tab-' + tab).style.display = 'block';
    
    if (tab === 'orders') loadOrders();
    if (tab === 'withdrawals') loadWithdrawals();
  }

  function formatTime(iso) {
    if (!iso) return '-';
    try {
      const d = new Date(iso + 'Z');
      return d.toLocaleString('ar-EG', {month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'});
    } catch(e) { return iso; }
  }
  
  
  async function updatePrice() {
    let p = document.getElementById('newPrice').value;
    let msg = document.getElementById('priceMsg');
    msg.innerText = 'جاري التحديث...';
    msg.style.color = 'var(--text)';
    try {
        let res = await fetch('/api/admin/price', {
            method: 'POST',
            headers: {'Content-Type': 'application/json', 'Authorization': 'Bearer ' + TOKEN},
            body: JSON.stringify({price: parseFloat(p)})
        });
        let data = await res.json();
        if (!res.ok) throw new Error(data.detail || 'خطأ غير معروف');
        msg.innerText = '✅ تم تحديث السعر بنجاح!';
        msg.style.color = 'var(--success)';
    } catch(e) {
        msg.innerText = '❌ ' + e.message;
        msg.style.color = 'var(--error)';
        if(e.message.includes('جلسة')) logout();
    }
  }

  function getHeaders() {
      return {'Authorization': 'Bearer ' + TOKEN};
  }

  function esc(s) {
      if (!s) return "";
      let d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
  }

  async function loadOrders(showLoading = true) {
    if(showLoading) document.getElementById('ordersContent').innerHTML = '<div class="loading">جاري التحميل...</div>';
    const status = document.getElementById('orderStatus').value;
    const search = document.getElementById('orderSearch').value;
    
    try {
      const res = await fetch(`/admin/orders?status=${status}&search=${encodeURIComponent(search)}&limit=100`, { headers: getHeaders() });
      if (!res.ok) throw new Error(res.status === 401 || res.status === 403 ? 'جلسة منتهية' : 'خطأ في جلب البيانات');
      const data = await res.json();
      
      let html = `<table>
        <tr>
          <th>ID</th><th>التاريخ</th><th>اليوزر</th><th>النجوم</th>
          <th>المبلغ</th><th>الطريقة / الكومنت</th><th>الحالة / الأخطاء</th>
        </tr>`;
        
      data.forEach(o => {
        let errHtml = o.error_message ? `<div class="error-text">⚠️ ${esc(o.error_message)}</div>` : '';
        let flagsHtml = '';
        if(o.testnet_flagged) flagsHtml += `<div class="flag">🚨 Testnet</div>`;
        if(o.underpayment_flagged) flagsHtml += `<div class="flag">⚠️ دفع ناقص (${o.underpaid_amount} TON)</div>`;
        
        let payMethod = o.payment_method === 'ton_transfer' ? `TON <br><small style="color:var(--text-muted)">${esc(o.comment) || '-'}</small>` : 'Cryptomus';
        
        html += `<tr>
          <td>#${o.id}</td>
          <td dir="ltr" style="text-align:right">${formatTime(o.created_at)}</td>
          <td dir="ltr" style="text-align:right">${esc(o.user_id)}</td>
          <td>${o.stars_amount.toLocaleString()} ⭐</td>
          <td>$${o.price_usd.toFixed(2)}</td>
          <td>${payMethod}</td>
          <td>
            <span class="badge b-${o.status}">${o.status}</span>
            ${flagsHtml ? `<div class="flags">${flagsHtml}</div>` : ''}
            ${errHtml}
          </td>
        </tr>`;
      });
      html += `</table>`;
      
      document.getElementById('ordersContent').innerHTML = data.length ? html : '<div class="loading">لا توجد طلبات.</div>';
      document.getElementById('lastUpdate').innerText = 'آخر تحديث: ' + new Date().toLocaleTimeString();
    } catch(e) {
      document.getElementById('ordersContent').innerHTML = `<div style="color:var(--error);padding:20px;">${e.message}</div>`;
      if(e.message === 'جلسة منتهية') logout();
    }
  }

  async function loadWithdrawals(showLoading = true) {
    if(showLoading) document.getElementById('withdrawalsContent').innerHTML = '<div class="loading">جاري التحميل...</div>';
    
    try {
      const res = await fetch(`/admin/withdrawals`, { headers: getHeaders() });
      if (!res.ok) throw new Error('خطأ في جلب البيانات');
      const data = await res.json();
      
      let html = `<table>
        <tr>
          <th>ID</th><th>التاريخ</th><th>البريد</th><th>المعرف الوجهة</th>
          <th>النجوم</th><th>الحالة</th><th>إجراء</th>
        </tr>`;
        
      data.forEach(w => {
        let actionBtn = w.status === 'pending' 
          ? `<button class="btn btn-sm" onclick="approveWithdrawal(${w.id})">✅ تنفيذ عبر Fragment</button>`
          : '-';
          
        html += `<tr>
          <td>#${w.id}</td>
          <td dir="ltr" style="text-align:right">${formatTime(w.created_at)}</td>
          <td>${esc(w.email)}</td>
          <td dir="ltr" style="text-align:right">${esc(w.recipient_username)}</td>
          <td>${w.stars_amount.toLocaleString()} ⭐</td>
          <td><span class="badge b-${w.status}">${w.status}</span></td>
          <td>${actionBtn}</td>
        </tr>`;
      });
      html += `</table>`;
      
      document.getElementById('withdrawalsContent').innerHTML = data.length ? html : '<div class="loading">لا توجد طلبات سحب.</div>';
    } catch(e) {
      document.getElementById('withdrawalsContent').innerHTML = `<div style="color:var(--error);padding:20px;">${e.message}</div>`;
    }
  }

  async function approveWithdrawal(wid) {
    if(!confirm('هل أنت متأكد من تنفيذ هذا الطلب وإرسال النجوم؟')) return;
    try {
      const res = await fetch(`/admin/approve-withdrawal/${wid}`, {
          method:'POST',
          headers: getHeaders()
      });
      const data = await res.json();
      if(!res.ok) alert('خطأ: ' + (data.detail || 'غير معروف'));
      else {
        alert('تم التنفيذ! الحالة: ' + data.status);
        loadWithdrawals();
      }
    } catch(e) {
      alert('خطأ في الاتصال');
    }
  }
</script>
</body>
</html>
